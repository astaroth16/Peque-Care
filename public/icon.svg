<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="heart" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#FB7185" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  
  <!-- Subtle circular halo -->
  <circle cx="256" cy="256" r="180" fill="white" opacity="0.12" />
  
  <!-- Main white icon container -->
  <g filter="url(#shadow)" fill="none" stroke="white" stroke-width="20" stroke-linecap="round" stroke-linejoin="round">
    <!-- Child head -->
    <circle cx="256" cy="180" r="54" fill="white" stroke="none" />
    
    <!-- Child body / arms raised happily -->
    <path d="M256 240 v80" stroke="white" stroke-width="24" />
    <path d="M180 270 Q218 250 256 260 Q294 250 332 270" stroke="white" stroke-width="20" />
    <path d="M216 380 L256 320 L296 380" stroke="white" stroke-width="24" />
  </g>
  
  <!-- Growth ruler tick marks on the left -->
  <g stroke="white" stroke-width="8" stroke-linecap="round" opacity="0.85">
    <line x1="120" y1="160" x2="160" y2="160" />
    <line x1="120" y1="210" x2="145" y2="210" />
    <line x1="120" y1="260" x2="160" y2="260" />
    <line x1="120" y1="310" x2="145" y2="310" />
    <line x1="120" y1="360" x2="160" y2="360" />
  </g>

  <!-- Floating Heart on upper right -->
  <path d="M360 140 C360 120 340 105 320 120 C300 105 280 120 280 140 C280 170 320 195 320 195 C320 195 360 170 360 140 Z" fill="url(#heart)" filter="url(#shadow)" transform="scale(0.8) translate(80, 20)" />

  <!-- Stars / sparkle -->
  <circle cx="390" cy="230" r="10" fill="#FDE047" />
  <circle cx="150" cy="120" r="8" fill="#FDE047" />
</svg>
